
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Risk Dashboard | Sign In</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #07152e, #102c52, #087e8b);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #172033;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 38px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin: 8px 0;
            color: #102c52;
        }

        .subtitle {
            text-align: center;
            color: #697386;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: #edf2f7;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #526176;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .tab.active {
            background: #ffffff;
            color: #087e8b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
            color: #344054;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #087e8b;
            box-shadow: 0 0 0 3px rgba(8, 126, 139, 0.12);
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 13px;
            margin-top: 5px;
            background: #087e8b;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #066773;
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .message {
            display: none;
            padding: 11px;
            margin-bottom: 16px;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.success {
            display: block;
            background: #e8f8ef;
            color: #17663a;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #a12626;
        }

        .security-note {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #7b8494;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <main class="auth-container">
        <div class="logo">🛡️</div>
        <h1>Cyber Risk Dashboard</h1>
        <p class="subtitle">Secure access to your risk management system</p>

        <div class="tabs">
            <button type="button" class="tab active" id="loginTab">
                Sign In
            </button>

            <button type="button" class="tab" id="registerTab">
                Create Account
            </button>
        </div>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <!-- SIGN IN FORM -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    autocomplete="username"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="submit-btn" id="loginButton">
                Sign In
            </button>
        </form>

        <!-- CREATE ACCOUNT FORM -->
        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label for="registerUsername">Username</label>
                <input
                    type="text"
                    id="registerUsername"
                    autocomplete="username"
                    minlength="3"
                    maxlength="30"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="registerEmail">Email Address</label>
                <input
                    type="email"
                    id="registerEmail"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="registerPassword">Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    autocomplete="new-password"
                    minlength="10"
                    maxlength="72"
                    placeholder="At least 10 characters"
                    required
                >
            </div>

            <button type="submit" class="submit-btn" id="registerButton">
                Create Account
            </button>
        </form>

        <p class="security-note">
            🛡️ Protected access · Cyber Risk Assessment & Management
        </p>
    </main>

    <script>
        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const messageBox = document.getElementById("message");

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = "message " + type;
        }

        function clearMessage() {
            messageBox.textContent = "";
            messageBox.className = "message";
        }

        function showLogin() {
            loginForm.classList.remove("hidden");
            registerForm.classList.add("hidden");
            loginTab.classList.add("active");
            registerTab.classList.remove("active");
            clearMessage();
        }

        function showRegister() {
            registerForm.classList.remove("hidden");
            loginForm.classList.add("hidden");
            registerTab.classList.add("active");
            loginTab.classList.remove("active");
            clearMessage();
        }

        loginTab.addEventListener("click", showLogin);
        registerTab.addEventListener("click", showRegister);

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const button = document.getElementById("loginButton");
            button.disabled = true;
            button.textContent = "Signing in...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: document.getElementById("loginEmail").value.trim(),
                        password: document.getElementById("loginPassword").value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Sign in failed.");
                }

                showMessage("Sign in successful. Opening dashboard...", "success");
                window.location.href = "/dashboard.html";
            } catch (error) {
                showMessage(
                    error.message || "Could not connect to the server.",
                    "error"
                );
            } finally {
                button.disabled = false;
                button.textContent = "Sign In";
            }
        });

        registerForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const button = document.getElementById("registerButton");
            button.disabled = true;
            button.textContent = "Creating account...";

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: document.getElementById("registerUsername").value.trim(),
                        email: document.getElementById("registerEmail").value.trim(),
                        password: document.getElementById("registerPassword").value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Could not create account.");
                }

                registerForm.reset();
                showLogin();

                document.getElementById("loginEmail").value =
                    document.getElementById("registerEmail").value.trim();

                showMessage(
                    "Account created successfully! You can now sign in.",
                    "success"
                );
            } catch (error) {
                showMessage(
                    error.message || "Could not connect to the server.",
                    "error"
                );
            } finally {
                button.disabled = false;
                button.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
```
